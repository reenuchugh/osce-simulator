<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NAC OSCE Simulator</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0f1420; color:#e8ecf1; margin:0; padding:0; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; color:#8fd3ff; }
  .card { background:#161c2c; border-radius:12px; padding:20px; margin-bottom:16px; border:1px solid #263250; }
  select, button { font-size:15px; padding:10px 14px; border-radius:8px; border:1px solid #33415c; background:#1e2740; color:#e8ecf1; cursor:pointer; }
  button:hover { background:#2a3654; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  #instructions { white-space: pre-wrap; line-height:1.5; }
  #timer { font-size: 28px; font-weight:bold; color:#8fd3ff; text-align:center; }
  #chatlog { height: 380px; overflow-y:auto; background:#0c1120; border-radius:8px; padding:14px; margin-bottom:12px; border:1px solid #263250; }
  .msg { margin-bottom:12px; padding:10px 14px; border-radius:10px; max-width:85%; line-height:1.4; }
  .msg.patient { background:#1e3a2e; margin-right:auto; }
  .msg.candidate { background:#233150; margin-left:auto; text-align:right; }
  .msg.system { background:#3a2e1e; margin: 0 auto; text-align:center; font-style:italic; font-size:13px; max-width:100%; }
  .msg.examiner { background:#3a1e2e; margin-right:auto; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  #textInput { flex:1; padding:10px; border-radius:8px; border:1px solid #33415c; background:#1e2740; color:#e8ecf1; font-size:15px; }
  .row { display:flex; gap:8px; align-items:center; }
  .badge { display:inline-block; padding:4px 10px; border-radius:6px; font-size:12px; background:#33415c; margin-right:6px; }
  #micBtn.recording { background:#7a2b2b; }
  small { color:#8892a8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🩺 Canadian NAC OSCE Simulator</h1>

  <div class="card" id="setupCard">
    <label>Choose a case:</label><br><br>
    <select id="caseSelect"></select>
    <button id="loadBtn">Load Case</button>
  </div>

  <div class="card" id="instructionsCard" style="display:none;">
    <div class="row" style="justify-content:space-between;">
      <span><span class="badge" id="stationTypeBadge"></span><span class="badge" id="durationBadge"></span></span>
    </div>
    <h2 id="caseTitle"></h2>
    <div id="instructions"></div>
    <button id="startBtn">START</button>
  </div>

  <div class="card" id="stationCard" style="display:none;">
    <div id="timer">08:00</div>
    <div id="chatlog"></div>
    <div class="row">
      <button id="micBtn">🎤 Speak</button>
      <input id="textInput" type="text" placeholder="Or type here and press Enter...">
    </div>
    <div class="controls">
      <button id="hardBtn">HARD</button>
      <button id="rapidBtn">RAPID</button>
      <button id="endBtn">END</button>
      <button id="feedbackBtn" style="display:none;">Get FEEDBACK</button>
    </div>
    <small>Voice uses your browser's built-in speech recognition/synthesis (Web Speech API). Chrome recommended.</small>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
